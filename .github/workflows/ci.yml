name: Vulnerability Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # The workflow only reads and executes repository content; it never publishes.
  contents: read

jobs:
  verify_lab:
    name: Verify lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Defense in depth: CI must remain deterministic and must never call OpenRouter.
      OPENROUTER_API_KEY: ""
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Verify deterministic vulnerability demo
        # Check both sides of the teaching contract, not merely process exit 0.
        run: |
          uv run segregation-demo > demo-output.txt
          grep -F "ALLOWED / LEAKED" demo-output.txt
          grep -F "BLOCKED / SAFE" demo-output.txt

      - name: Verify OGI outbound validation demo
        run: |
          uv run segregation-demo-ogi > ogi-demo-output.txt
          grep -F "BLOCKED / SAFE" ogi-demo-output.txt
          grep -F "lineage" ogi-demo-output.txt
